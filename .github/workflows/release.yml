name: Release

# Builds the Windows installer, MediaHub-Setup-<version>.exe, and attaches it to a GitHub release.
#
# Why Windows minutes only run on release and manual runs: the Windows job is slow and billed at a higher
# rate. Every push and pull request is already covered by ci.yml on Linux.
#
# The write token (contents: write) exists only in the publish job, which runs no npm code. The build job,
# which runs npm ci and the project's scripts, has read-only access.
#
# The update signing key (UPDATE_SIGNING_KEY) is only in the `release` environment, which only v* tags reach. Only
# the "Sign the update manifest" step in the publish job can read it. See docs/DEVELOPMENT.md, "Update signing".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch and verify the newest Node patch for the .node-version major
        id: pick
        run: |
          set -euo pipefail
          MAJOR=$(cut -d. -f1 .node-version)
          curl -fsSL https://nodejs.org/dist/index.json -o "$RUNNER_TEMP/index.json"
          VERSION=$(jq -r --arg prefix "v${MAJOR}." '[.[] | select(.version | startswith($prefix))][0].version // empty' "$RUNNER_TEMP/index.json")
          if [ -z "$VERSION" ]; then echo "No Node $MAJOR release in index.json."; exit 1; fi
          VERSION=${VERSION#v}
          echo "Newest Node $MAJOR release: $VERSION"
          mkdir -p "$RUNNER_TEMP/node-dl"
          cd "$RUNNER_TEMP/node-dl"
          BASE="https://nodejs.org/dist/v$VERSION"
          curl -fsSLO "$BASE/node-v$VERSION-win-x64.zip"
          curl -fsSLO "$BASE/SHASUMS256.txt"
          curl -fsSLO "$BASE/SHASUMS256.txt.sig"
          # Node's release keyring, pinned to a commit of nodejs/release-keys.
          curl -fsSL -o pubring.kbx https://raw.githubusercontent.com/nodejs/release-keys/481637f813e912c4aa3622d7964ab426c97b8e8d/gpg/pubring.kbx
          gpgv --keyring ./pubring.kbx SHASUMS256.txt.sig SHASUMS256.txt
          grep " node-v$VERSION-win-x64.zip$" SHASUMS256.txt | sha256sum -c -
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload the verified zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-win
          path: |
            ${{ runner.temp }}/node-dl/node-v*-win-x64.zip
            ${{ runner.temp }}/node-dl/SHASUMS256.txt
          retention-days: 1

  build:
    needs: node
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      NODE_VERSION: ${{ needs.node.outputs.version }}
      WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the installer version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $base = [string]$package.version
          if ($env:EVENT_NAME -eq 'release') {
            $tag = $env:RELEASE_TAG
            if ($tag -notmatch ('^v' + [regex]::Escape($base) + '(-rc\.[0-9]+)?$')) {
              throw "Release tag '$tag' must be v$base or v$base-rc.N to match package.json."
            }
            $version = $tag.Substring(1)
          } else {
            $version = "$base-dev.$env:RUN_NUMBER"
          }
          Write-Host "Installer version: $version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Download the verified Node zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-win
          path: node-win

      - name: Re-check the Node zip and extract node.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipName = "node-v$env:NODE_VERSION-win-x64.zip"
          $zip = Join-Path 'node-win' $zipName
          $line = Get-Content -Path 'node-win/SHASUMS256.txt' | Where-Object { $_ -match ('\s' + [regex]::Escape($zipName) + '$') } | Select-Object -First 1
          if (-not $line) { throw "$zipName is not listed in SHASUMS256.txt." }
          $expected = (($line -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch for $zipName (got $actual)." }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'node-bin') -Force
          $nodeExe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'node-bin') -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw 'node.exe not found in the zip.' }
          Write-Host "Bundled node.exe: $($nodeExe.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "BUNDLED_NODE=$($nodeExe.FullName)"

      - name: Set up Node (same exact version, for building)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.node.outputs.version }}
          cache: npm

      # Lint, typecheck and tests already ran on Linux in ci.yml before the merge. Windows minutes cost more,
      # so this job only builds the package and tests the installer.
      - run: npm ci
      # build-info.json must carry the installer's version (with any -rc.N), because the updater compares it.
      - name: Build the package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package -- --version $env:APP_VERSION

      - name: Check the bundled Node version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "v$env:NODE_VERSION"
          $built = (node -p "process.version").Trim()
          $bundled = (& $env:BUNDLED_NODE -p "process.version").Trim()
          $info = Get-Content -Raw dist/mediahub/build-info.json | ConvertFrom-Json
          Write-Host "build node: $built, bundled node: $bundled, build-info: $($info.node)"
          if ($built -ne $expected -or $bundled -ne $expected -or $info.node -ne $expected) {
            throw "Node version mismatch: expected $expected."
          }
          if ($info.version -ne $env:APP_VERSION) { throw "build-info.json version $($info.version) is not $env:APP_VERSION." }

      - name: Download WinSW and verify it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'winsw'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'WinSW-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINSW_SHA256) { throw "WinSW SHA-256 mismatch (got $actual)." }

      - name: Stage the installer folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'service') | Out-Null
          Copy-Item -Path $env:BUNDLED_NODE -Destination (Join-Path $stage 'node.exe')
          Copy-Item -Path 'dist\mediahub' -Destination (Join-Path $stage 'app') -Recurse
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'winsw\WinSW-x64.exe') -Destination (Join-Path $stage 'service\MediaHub.exe')
          Copy-Item -Path 'installer\MediaHub.xml' -Destination (Join-Path $stage 'service\MediaHub.xml')
          Copy-Item -Path 'installer\mediahub-tool.cmd' -Destination (Join-Path $stage 'mediahub-tool.cmd')
          Get-ChildItem -Recurse -Path $stage | Select-Object -ExpandProperty FullName | Select-Object -First 200

      - name: Smoke test the staged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $app = Join-Path $stage 'app'
          $node = Join-Path $stage 'node.exe'
          $data = Join-Path $env:RUNNER_TEMP 'mh-smoke-data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $envFile = Join-Path $env:RUNNER_TEMP 'mh-smoke.env'
          $lines = @(
            'BETTER_AUTH_URL=http://127.0.0.1:7979',
            ('DATABASE_PATH=' + (Join-Path $data 'mediahub.db')),
            'MEDIAHUB_HOST=127.0.0.1',
            'MEDIAHUB_PORT=7979'
          )
          [System.IO.File]::WriteAllLines($envFile, $lines, [System.Text.UTF8Encoding]::new($false))

          function Test-Login {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7979/login' -UseBasicParsing -TimeoutSec 5
              return ($r.StatusCode -eq 200)
            } catch { return $false }
          }

          $proc = Start-Process -FilePath $node `
            -ArgumentList @(('--env-file="' + $envFile + '"'), ('"' + (Join-Path $app 'mediahub.mjs') + '"')) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'mh-server.log') `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'mh-server.err.log') `
            -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok -and -not $proc.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $ok = Test-Login
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if (-not $ok) {
            Get-Content (Join-Path $env:RUNNER_TEMP 'mh-server.log'), (Join-Path $env:RUNNER_TEMP 'mh-server.err.log') -ErrorAction SilentlyContinue
            throw '/login did not return 200 from the staged app.'
          }

          # The migrate tool is idempotent: two runs against the same DB must both succeed.
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($run in 1..2) {
              & $node ('--env-file=' + $envFile) (Join-Path $app 'tools\migrate.mjs')
              if ($LASTEXITCODE -ne 0) { throw "migrate run $run exited with $LASTEXITCODE." }
            }
          } finally {
            Pop-Location
          }

      - name: Compile the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup 6) not found on this runner.' }
          Write-Host "Using $iscc, version $((Get-Item $iscc).VersionInfo.ProductVersion)"
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$stage" "/DOutputDir=$out" 'installer\mediahub.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Install, upgrade and uninstall on the runner
        shell: pwsh
        timeout-minutes: 20
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "out\MediaHub-Setup-$env:APP_VERSION.exe"
          $dataDir = Join-Path $env:ProgramData 'MediaHub'
          $appDir = Join-Path $env:ProgramFiles 'MediaHub'
          $dbPath = Join-Path $dataDir 'data\mediahub.db'
          $envPath = Join-Path $dataDir 'mediahub.env'
          $logs = Join-Path $env:RUNNER_TEMP 'installer-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          function Test-Login {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7979/login' -UseBasicParsing -TimeoutSec 5
              return ($r.StatusCode -eq 200)
            } catch { return $false }
          }
          function Wait-Login([int]$seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              if (Test-Login) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          function Get-MediaHubService { Get-CimInstance Win32_Service -Filter "Name='MediaHub'" }
          # schtasks writes to stderr when the task is missing. Continue keeps that from stopping the step.
          function Get-UpdaterTask([string]$name = 'MediaHub\Updater') {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $out = & "$env:SystemRoot\System32\schtasks.exe" /query /tn $name /xml 2>&1
              return @{ Code = $LASTEXITCODE; Text = ($out | Out-String) }
            } finally {
              $ErrorActionPreference = $prev
              # A missing task is often the expected answer. The runner ends a pwsh step with the last program's exit
              # code, so schtasks' 1 for "not found" would otherwise fail a step whose checks all passed.
              $global:LASTEXITCODE = 0
            }
          }
          # Updates run from the launcher, not from scheduled tasks: neither task may exist.
          function Assert-NoUpdaterTask {
            foreach ($name in @('MediaHub\Updater', 'MediaHub\UpdateInstall')) {
              if ((Get-UpdaterTask $name).Code -eq 0) { throw "The $name scheduled task exists. Updates must not use scheduled tasks." }
            }
          }
          # Runs Setup or the uninstaller with a time limit. A plain -Wait has none, so a hidden dialog hung the job until
          # its 40-minute limit with no log. On a timeout the process tree is killed and the run's log is printed.
          function Invoke-Timed([string]$file, [string]$name, [int]$seconds = 300) {
            $log = Join-Path $logs "$name.log"
            $p = Start-Process -FilePath $file -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log") -PassThru
            $null = $p.Handle  # keep the handle, so ExitCode is available after exit
            if (-not $p.WaitForExit($seconds * 1000)) {
              & "$env:SystemRoot\System32\taskkill.exe" /T /F /PID $p.Id 2>&1 | Out-Null
              # Out-Host: plain output would go into the caller's variable and be lost with the throw.
              if (Test-Path -LiteralPath $log) { Write-Host "--- $name.log"; Get-Content -LiteralPath $log | Out-Host }
              throw "$name did not finish within $seconds seconds."
            }
            $p.WaitForExit()
            return [int]$p.ExitCode
          }
          function Invoke-Installer([string]$name) {
            $code = Invoke-Timed $installer $name
            if ($code -ne 0) { throw "$name exited with $code." }
          }
          # Compares names without spaces: LocalService is "NT AUTHORITY\LocalService" in WMI and "NT AUTHORITY\LOCAL SERVICE" in ACLs.
          function Get-Entries([string]$path, [string]$account) {
            $wanted = $account -replace ' ', ''
            @((Get-Acl -LiteralPath $path).Access | Where-Object { (($_.IdentityReference.Value) -replace ' ', '') -ieq $wanted })
          }
          function Test-Writes($entries) {
            @($entries | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.FileSystemRights.ToString() -match 'Modify|Write|FullControl|ChangePermissions|TakeOwnership' }).Count -gt 0
          }
          # The data folder must not inherit, and must grant nothing to users or everyone.
          function Assert-DataLocked {
            $acl = Get-Acl -LiteralPath $dataDir
            if (@($acl.Access | Where-Object { $_.IsInherited }).Count -gt 0) { throw 'The data folder still inherits permissions.' }
            $broad = @($acl.Access | Where-Object { $_.IdentityReference.Value -match 'BUILTIN\\Users|Authenticated Users|Everyone|CREATOR OWNER' })
            if ($broad.Count -gt 0) { throw 'The data folder grants BUILTIN\Users, CREATOR OWNER or wider.' }
          }
          function Assert-DataAcl([string]$account) {
            Assert-DataLocked
            $root = Get-Entries $dataDir $account
            if ($root.Count -eq 0) { throw "No entry for $account on the data folder." }
            if (Test-Writes $root) { throw "$account can change the data folder itself." }
            if (Test-Writes (Get-Entries $envPath $account)) { throw "$account can change mediahub.env." }
            foreach ($sub in @('data', 'logs')) {
              if (-not (Test-Writes (Get-Entries (Join-Path $dataDir $sub) $account))) { throw "$account cannot write to $sub." }
            }
            # The updater's folder is read-only for the service, except the requests folder ("check now" files).
            $updates = Join-Path $dataDir 'updates'
            if (Test-Writes (Get-Entries $updates $account)) { throw "$account can change the updates folder itself." }
            if (-not (Test-Writes (Get-Entries (Join-Path $updates 'requests') $account))) { throw "$account cannot write to updates\requests." }
          }

          # A data folder planted by a standard user before the first install must be refused.
          $squatter = 'mhsquat'
          $pw = ConvertTo-SecureString ([guid]::NewGuid().ToString() + 'aA1!') -AsPlainText -Force
          New-LocalUser -Name $squatter -Password $pw | Out-Null
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -LiteralPath $envPath -Value 'BETTER_AUTH_URL=http://127.0.0.1:7979'
          & icacls.exe $envPath /setowner $squatter | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls /setowner failed with $LASTEXITCODE." }
          # The owner check on its own first, in the same Windows PowerShell the installer uses, so its output shows here.
          $check = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File installer\check-data-owners.ps1 -Path $dataDir 2>&1
          $checkCode = $LASTEXITCODE
          Write-Host "Owner check exit code $checkCode`: $check"
          if ($checkCode -ne 3) { throw 'The owner check did not refuse the planted file (expected exit code 3).' }
          $squatCode = Invoke-Timed $installer 'squat'
          if ($squatCode -eq 0) { throw 'The installer accepted a data folder with a file owned by a standard user.' }
          if (Get-MediaHubService) { throw 'The installer created the service despite the planted data folder.' }
          if (-not (Select-String -LiteralPath (Join-Path $logs 'squat.log') -Pattern 'not created by an administrator' -Quiet)) {
            Get-Content -LiteralPath (Join-Path $logs 'squat.log')
            throw 'The refusal message is missing from the Setup log.'
          }
          # The refusal must come from PrepareToInstall, before any program files are copied.
          if (Test-Path -LiteralPath (Join-Path $appDir 'app')) {
            Get-Content -LiteralPath (Join-Path $logs 'squat.log')
            throw 'Setup copied program files before refusing the planted data folder.'
          }
          if (-not (Select-String -LiteralPath (Join-Path $logs 'squat.log') -Pattern 'Refused:' -SimpleMatch -Quiet)) {
            Get-Content -LiteralPath (Join-Path $logs 'squat.log')
            throw 'The Setup log has no Refused: line from PrepareToInstall.'
          }
          Remove-Item -LiteralPath $dataDir -Recurse -Force
          Remove-LocalUser -Name $squatter

          try {
            # First install.
            Invoke-Installer 'install'
            if (-not (Test-Path $envPath)) { throw 'mediahub.env was not created.' }
            $bytes = [System.IO.File]::ReadAllBytes($envPath)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'mediahub.env starts with a BOM.' }
            if (-not (Wait-Login 60)) { throw 'First install: /login did not return 200 within 60 s.' }
            $svc = Get-MediaHubService
            if (-not $svc) { throw 'The MediaHub service is missing after install.' }
            if ($svc.StartName -ne 'LocalSystem') { throw "Unexpected service account: $($svc.StartName)." }
            if ($svc.State -ne 'Running') { throw "Service state after install: $($svc.State)." }
            # A LocalSystem install grants no service account access, so only the locked-down folder is checked.
            Assert-DataLocked
            Assert-NoUpdaterTask
            $rollbackCopy = Join-Path $dataDir "updates\installers\MediaHub-Setup-$env:APP_VERSION.exe"
            if (-not (Test-Path $rollbackCopy)) { throw "The rollback installer copy is missing: $rollbackCopy." }
            # GitHub is reachable and its reply parses. No release has an update manifest yet, so this is up to date.
            & "$appDir\node.exe" "--env-file=$envPath" "$appDir\app\tools\updater.mjs" --app-dir $appDir --data-dir $dataDir --check-only
            if ($LASTEXITCODE -ne 0) { throw "updater --check-only exited with $LASTEXITCODE." }
            if (-not (Test-Path (Join-Path $dataDir 'updates\status.json'))) { throw 'updater --check-only did not write updates\status.json.' }
            $rule = Get-NetFirewallRule -DisplayName 'MediaHub' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $rule) { throw 'Firewall rule MediaHub is missing.' }
            $portFilter = $rule | Get-NetFirewallPortFilter
            if ($portFilter.LocalPort -ne '7979') { throw "Firewall rule port is $($portFilter.LocalPort), expected 7979." }
            if ($rule.Profile.ToString() -ne 'Private') { throw "Firewall rule profile is $($rule.Profile), expected Private." }

            # Move the service to a different account, then upgrade: the upgrade must keep it.
            & sc.exe config MediaHub obj= "NT AUTHORITY\LocalService" password= ""
            if ($LASTEXITCODE -ne 0) { throw "sc config failed with $LASTEXITCODE." }

            Invoke-Installer 'upgrade'
            if (-not (Wait-Login 60)) { throw 'Upgrade: /login did not return 200 within 60 s.' }
            $svc = Get-MediaHubService
            if ($svc.StartName -ne 'NT AUTHORITY\LocalService') { throw "Upgrade changed the service account to $($svc.StartName)." }
            if ($svc.State -ne 'Running') { throw "Service state after upgrade: $($svc.State)." }
            Assert-DataAcl 'NT AUTHORITY\LocalService'
            Assert-NoUpdaterTask
            if (-not (Test-Path $dbPath)) { throw 'The database is missing after upgrade.' }

            # Silent uninstall: the service and firewall rule go, the data stays.
            $uninst = Join-Path $appDir 'unins000.exe'
            if (-not (Test-Path $uninst)) { throw "$uninst not found." }
            $code = Invoke-Timed $uninst 'uninstall'
            if ($code -ne 0) { throw "Uninstall exited with $code." }
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-MediaHubService) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            if (Get-MediaHubService) { throw 'The MediaHub service is still present after uninstall.' }
            if (Get-NetFirewallRule -DisplayName 'MediaHub' -ErrorAction SilentlyContinue) { throw 'The firewall rule is still present after uninstall.' }
            if (-not (Test-Path $dbPath)) { throw 'The database was deleted by a silent uninstall.' }
            if ((Get-UpdaterTask).Code -eq 0) { throw 'The MediaHub\Updater task is still present after uninstall.' }
            if ((Get-UpdaterTask 'MediaHub\UpdateInstall').Code -eq 0) { throw 'The MediaHub\UpdateInstall task is still present after uninstall.' }
            if (Test-Path (Join-Path $dataDir 'updates\installers')) { throw 'updates\installers is still present after uninstall.' }
            Write-Host 'Install, upgrade and uninstall checks passed.'
          } catch {
            Write-Host '::group::Installer, uninstaller and WinSW logs'
            Get-ChildItem -Path $logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content -Path $_.FullName }
            Get-ChildItem -Path (Join-Path $dataDir 'logs') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content -Path $_.FullName }
            Write-Host '::endgroup::'
            throw
          }

      - name: Collect the release files
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $exeName = "MediaHub-Setup-$env:APP_VERSION.exe"
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP "out\$exeName") -Destination (Join-Path $release $exeName)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $release $exeName)).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $release "$exeName.sha256"), "$hash  $exeName`n", [System.Text.UTF8Encoding]::new($false))
          Copy-Item -Path 'dist\mediahub\build-info.json' -Destination $release
          Get-ChildItem $release | Select-Object Name, Length

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/release
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: [node, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with a write token. It runs no project code: only gh, openssl and jq. Only the signing step
    # can read the update signing key, from the release environment.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      NODE_VERSION: ${{ needs.node.outputs.version }}
    steps:
      - name: Check out the update public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installer files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          # Not "installer": that is the checked-out folder with the public key in it.
          path: installer-files

      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Only release tags are signed, whatever the environment's tag rule says.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then echo "Refusing to sign tag '$TAG'."; exit 1; fi
          VERSION="${TAG#v}"
          EXE="MediaHub-Setup-$VERSION.exe"
          test -f "installer-files/$EXE"
          # The hash is taken here, from the file this job uploads, not from the build job.
          SHA=$(sha256sum "installer-files/$EXE" | cut -d' ' -f1)
          SIZE=$(stat -c %s "installer-files/$EXE")
          jq -cn --arg v "$VERSION" --arg i "$EXE" --arg s "$SHA" --argjson z "$SIZE" '{schema:1,product:"MediaHub",version:$v,installer:$i,sha256:$s,size:$z}' > installer-files/update-manifest.json
          umask 077
          KEY="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in installer-files/update-manifest.json -out "$RUNNER_TEMP/sig.bin"
          rm -f "$KEY"
          # Checked against the public key in the repo, so a wrong secret fails here and nothing is published.
          openssl pkeyutl -verify -pubin -inkey installer/update-public-key.pem -rawin -in installer-files/update-manifest.json -sigfile "$RUNNER_TEMP/sig.bin"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > installer-files/update-manifest.json.sig

      - name: Attach the files and note the bundled Node version
        run: |
          set -euo pipefail
          gh release upload "$TAG" installer-files/* --clobber
          body=$(gh release view "$TAG" --json body --jq .body)
          if ! printf '%s\n' "$body" | grep -q "^Bundled Node "; then
            { printf '%s\n\n' "$body"; echo "Bundled Node $NODE_VERSION."; } > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
